    <script>
      const trackZone = document.querySelector('.f1-track-zone');
      const towGroup = document.getElementById('f1TowGroup');
      let animationTriggered = false;
    
      window.addEventListener('scroll', () => {
        if (animationTriggered) return;
    
        const trackPosition = trackZone.getBoundingClientRect().top;
        const screenHeight = window.innerHeight;
    
    
        if (trackPosition < screenHeight) {
          animationTriggered = true;
          
          towGroup.classList.add('f1-drive-active');
        }
      });
    </script>
